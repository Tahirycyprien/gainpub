name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
      - name: Creer le projet Android
        run: flutter create --platforms=android --project-name gainpub --org com.gainpub .
      - name: Autorisations et AdMob
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6535401140220842~1948233720"/>\n    </application>#' $M
          sed -i 's/"com.android.application" version "8.1.0"/"com.android.application" version "8.1.4"/' android/settings.gradle
          grep -n "com.android.application" android/settings.gradle
      - run: flutter pub get
      - name: Construire l APK
        run: |
          flutter build apk --release > build.log 2>&1 || { grep -n -A 12 "What went wrong" build.log; tail -n 25 build.log; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
